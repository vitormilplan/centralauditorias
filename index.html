<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central de Auditorias — Checklists — Milplan</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap');

:root{
  --navy-900:#0b1c33;
  --navy-800:#122c4f;
  --navy-700:#193a66;
  --red-600:#a83232;
  --red-700:#8c2828;
  --gold-500:#e0a83e;
  --blue-400:#5b8fc9;
  --bg:#eef1f5;
  --card:#ffffff;
  --text-dark:#1b2430;
  --text-muted:#6b7480;
  --border:#e1e5eb;
  --green-ok:#2f8f5b;
  --amber-warn:#c78a1e;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text-dark);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{
  font-family:'Barlow Condensed',sans-serif;
  text-transform:uppercase;
  letter-spacing:.02em;
}
.app{max-width:1280px;margin:0 auto;padding:0 0 60px;}

/* HEADER */
.header{
  background:linear-gradient(135deg,var(--navy-900),var(--navy-800));
  border-bottom:4px solid var(--red-600);
  padding:22px 28px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:16px;
}
.brand{display:flex;align-items:center;gap:14px;}
.brand-mark{
  width:auto;height:54px;
  display:flex;align-items:center;justify-content:center;
  background:#fff;
  border-radius:8px;
  padding:6px 12px;
  box-shadow:0 1px 4px rgba(0,0,0,.15);
}
.brand-mark img{height:100%;width:auto;object-fit:contain;}
.brand-text h1{color:#fff;font-size:24px;margin:0;font-weight:700;line-height:1.1;}
.brand-text .sub{color:#a9bcd6;font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin-top:2px;}
.mode-pill{
  font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  background:rgba(255,255,255,.08);color:#cfe0f5;
  border:1px solid rgba(255,255,255,.18);
  padding:6px 12px;border-radius:20px;
  display:flex;align-items:center;gap:8px;
}
.mode-pill.edit{background:rgba(224,168,62,.15);border-color:rgba(224,168,62,.4);color:var(--gold-500);}

/* CONTROLS BAR */
.controls{
  background:var(--card);
  margin:20px 28px 0;
  border-radius:12px;
  border:1px solid var(--border);
  padding:16px 20px;
  display:flex;
  gap:20px;
  align-items:flex-end;
  flex-wrap:wrap;
  box-shadow:0 1px 3px rgba(15,30,55,.04);
}
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);font-weight:600;}
select{
  font-family:'Inter',sans-serif;
  font-size:14px;font-weight:600;
  padding:9px 32px 9px 12px;
  border-radius:8px;
  border:1.5px solid var(--border);
  background:#fff;
  color:var(--navy-900);
  min-width:200px;
  appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%23193a66'/></svg>");
  background-repeat:no-repeat;
  background-position:right 12px center;
  cursor:pointer;
}
.tabbar{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap;}
.tabbtn{
  font-family:'Inter',sans-serif;font-weight:600;font-size:13px;
  padding:9px 16px;border-radius:8px;border:1.5px solid var(--border);
  background:#fff;color:var(--text-muted);cursor:pointer;
}
.tabbtn.active{background:var(--navy-800);color:#fff;border-color:var(--navy-800);}
.linkbtn{
  font-family:'Inter',sans-serif;font-weight:600;font-size:13px;
  padding:9px 16px;border-radius:8px;border:1.5px solid var(--gold-500);
  background:#fff8ea;color:var(--amber-warn);cursor:pointer;
}
.linkbtn:hover{background:#fdeecb;}

/* SECTIONS */
.section{margin:22px 28px 0;}
.section-title{
  font-size:20px;font-weight:700;color:var(--navy-900);
  display:flex;align-items:center;gap:10px;margin-bottom:12px;
}
.section-title .bar{width:4px;height:18px;background:var(--red-600);border-radius:2px;}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;}
.kpi{
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:18px 20px;box-shadow:0 1px 3px rgba(15,30,55,.04);
  position:relative;overflow:hidden;
}
.kpi .label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);font-weight:700;}
.kpi .value{font-family:'Barlow Condensed',sans-serif;font-size:38px;font-weight:700;color:var(--navy-900);margin-top:4px;}
.kpi .value.ok{color:var(--green-ok);}
.kpi .value.warn{color:var(--amber-warn);}
.kpi .value.bad{color:var(--red-600);}
.kpi .note{font-size:12px;color:var(--text-muted);margin-top:2px;}

.card{
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:20px;box-shadow:0 1px 3px rgba(15,30,55,.04);
}

/* RANKING BARS */
.rank-row{display:flex;align-items:center;gap:10px;padding:7px 0;}
.rank-label{width:140px;font-size:12.5px;font-weight:700;color:var(--navy-900);flex-shrink:0;}
.rank-track{flex:1;background:#eef1f6;border-radius:5px;height:20px;position:relative;overflow:hidden;}
.rank-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--navy-700),var(--blue-400));}
.rank-fill.low{background:linear-gradient(90deg,#b5451f,var(--gold-500));}
.rank-pct{width:56px;text-align:right;font-size:12.5px;font-weight:700;color:var(--navy-900);flex-shrink:0;}

/* PENDENCIAS / NAO CONFORMIDADES LIST */
.pend-item{
  display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid #f0f2f5;
}
.pend-item:first-child{border-top:none;}
.pend-dot{width:8px;height:8px;border-radius:50%;background:var(--red-600);margin-top:6px;flex-shrink:0;}
.pend-main .t{font-size:13.5px;font-weight:600;color:var(--text-dark);}
.pend-main .m{font-size:12px;color:var(--text-muted);margin-top:1px;}
.pend-main .e{font-size:12px;color:#7a1f1f;background:#fdeceb;border-radius:6px;padding:6px 9px;margin-top:5px;}

.empty{text-align:center;color:var(--text-muted);padding:30px 10px;font-size:13.5px;}
.empty b{color:var(--green-ok);}

.gestor-banner{
  background:#fff8ea;border:1px solid #f0d99a;color:#7a5a10;
  border-radius:10px;padding:12px 16px;font-size:13px;margin:20px 28px 0;
  display:flex;gap:10px;align-items:center;
}
.gestor-banner b{color:var(--amber-warn);}

.footer-note{
  text-align:center;color:var(--text-muted);font-size:11.5px;padding:30px 20px 0;
}
.footer-link{color:var(--text-muted);text-decoration:underline;text-decoration-color:rgba(102,115,140,.35);cursor:pointer;}
.footer-link:hover{color:var(--navy-800);}

.save-status{
  font-size:11.5px;font-weight:600;padding:5px 12px;border-radius:20px;
  display:flex;align-items:center;gap:6px;
}
.save-status.pending{background:rgba(255,255,255,.08);color:#cfe0f5;}
.save-status.saving{background:rgba(224,168,62,.15);color:var(--gold-500);}
.save-status.saved{background:rgba(47,143,91,.15);color:#7fd9a5;}
.save-status.error{background:rgba(168,50,50,.2);color:#ff9d9d;}

@media (max-width:640px){
  .header{padding:16px 16px;}
  .controls{margin:16px 16px 0;padding:14px;}
  .section{margin:18px 16px 0;}
  .tabbar{margin-left:0;width:100%;}
  select{min-width:140px;flex:1;}
}

.data-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:14px;}
.data-table th{
  background:var(--navy-800);color:#fff;text-align:left;font-size:11.5px;font-weight:700;
  letter-spacing:.02em;padding:9px 12px;
}
.data-table th:first-child{border-radius:6px 0 0 6px;}
.data-table th:last-child{border-radius:0 6px 6px 0;}
.data-table td{padding:7px 10px;border-bottom:1px solid #f0f2f5;vertical-align:middle;}
.data-table tr:hover td{background:#fafbfc;}
.data-table tr.clickable{cursor:pointer;}
.cad-input{
  font-family:'Inter',sans-serif;font-size:13px;padding:6px 9px;border:1px solid var(--border);
  border-radius:6px;background:#fff;color:var(--text-dark);width:100%;
}
.cad-form{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;border-top:1px solid var(--border);padding-top:14px;margin-top:14px;}
.cad-form .field{min-width:140px;}
.danger-btn{border-color:var(--red-600) !important;color:var(--red-600) !important;background:#fdeceb !important;}
.danger-btn:hover{background:#fbdedb !important;}
.empty-cad{text-align:center;color:var(--text-muted);padding:20px 10px;font-size:13px;}
.icon-btn{
  width:34px;height:34px;border-radius:8px;border:1.5px solid var(--border);
  background:#fff;color:var(--text-muted);font-size:15px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:.15s;
}
.icon-btn:hover{background:#f5f6f8;color:var(--navy-800);}
.icon-btn:disabled{opacity:.4;cursor:default;}

/* DISCIPLINE ACCORDION (biblioteca de checklists) */
.disc-block{border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden;}
.disc-head{
  background:var(--navy-800);color:#fff;padding:12px 16px;
  display:flex;align-items:center;justify-content:space-between;cursor:pointer;
  user-select:none;gap:12px;
}
.disc-head .name{font-weight:700;font-size:14px;letter-spacing:.03em;}
.disc-head .stats{font-size:12.5px;color:#cfe0f5;}
.disc-head .caret{transition:transform .15s;font-size:12px;}
.disc-head.open .caret{transform:rotate(90deg);}
.disc-body{display:none;padding:12px 16px;}
.disc-body.open{display:block;}
.checklist-row{
  display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #f0f2f5;
}
.checklist-row:first-child{border-top:none;}
.checklist-row .nm{flex:1;font-size:13.5px;font-weight:600;color:var(--text-dark);}
.checklist-row .cnt{font-size:11.5px;color:var(--text-muted);}
.status-tag{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 9px;border-radius:10px;}
.status-tag.ativo{background:#e7f5ee;color:var(--green-ok);}
.status-tag.inativo{background:#f0f2f5;color:var(--text-muted);}

/* EDITOR DE ITENS DE CHECKLIST */
.item-edit-row{display:flex;gap:8px;align-items:center;padding:6px 0;}
.item-edit-row .idx{width:22px;text-align:center;font-size:11.5px;color:var(--text-muted);font-weight:700;flex-shrink:0;}

/* AUDITOR: cartões de item */
.item-card{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:10px;background:#fff;}
.item-card.invalid{border-color:var(--red-600);background:#fff8f7;}
.item-num{font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;}
.item-txt{font-size:14.5px;font-weight:600;color:var(--text-dark);margin-bottom:12px;line-height:1.4;}
.result-group{display:flex;gap:6px;flex-wrap:wrap;}
.result-btn{
  font-family:'Inter',sans-serif;font-size:12.5px;font-weight:700;
  padding:9px 16px;border-radius:8px;border:1.5px solid var(--border);
  background:#fff;color:var(--text-muted);cursor:pointer;transition:.12s;
}
.result-btn.conforme.on{background:var(--green-ok);border-color:var(--green-ok);color:#fff;}
.result-btn.naoconforme.on{background:var(--red-600);border-color:var(--red-600);color:#fff;}
.result-btn.na.on{background:var(--amber-warn);border-color:var(--amber-warn);color:#fff;}
.item-comment{
  width:100%;min-height:60px;border:1.5px solid var(--border);border-radius:8px;
  padding:9px 11px;font-family:'Inter',sans-serif;font-size:12.5px;color:var(--text-dark);
  resize:vertical;margin-top:12px;
}
.item-comment.required{border-color:var(--red-600);background:#fff8f7;}
.item-comment::placeholder{color:#9aa3b2;}
.comment-hint{font-size:11px;color:var(--text-muted);margin-top:4px;}
.comment-hint.required{color:var(--red-600);font-weight:600;}

.disc-tag{
  display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  padding:3px 9px;border-radius:10px;background:#eef1f6;color:var(--navy-800);
}
.auditor-progress{font-size:12.5px;color:var(--text-muted);margin-bottom:14px;}
.auditor-progress b{color:var(--navy-900);}

.result-summary-strip{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}
.result-summary-strip .chip{font-size:12px;font-weight:700;padding:7px 14px;border-radius:20px;}
.result-summary-strip .chip.ok{background:#e7f5ee;color:var(--green-ok);}
.result-summary-strip .chip.bad{background:#fdeceb;color:var(--red-600);}
.result-summary-strip .chip.na{background:#fdf3e2;color:var(--amber-warn);}

.success-box{text-align:center;padding:50px 20px;}
.success-box .ico{font-size:44px;margin-bottom:10px;}

/* CAMPANHAS DE AUDITORIA (gestor + seletor do auditor/líder) */
.camp-card{
  border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:10px;
  background:#fff;cursor:pointer;transition:.12s;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.camp-card:hover{border-color:var(--navy-700);box-shadow:0 2px 8px rgba(15,30,55,.08);}
.camp-card .info{flex:1;min-width:180px;}
.camp-card .titulo{font-size:14.5px;font-weight:700;color:var(--navy-900);}
.camp-card .meta{font-size:12px;color:var(--text-muted);margin-top:2px;}
.camp-card .cnt{font-size:12px;color:var(--text-muted);}

/* REVISÃO DO AUDITOR LÍDER */
.lider-exec-card{border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px;background:#fff;}
.lider-exec-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid #f0f2f5;}
.lider-exec-head .titulo{font-size:14.5px;font-weight:700;color:var(--navy-900);}
.lider-exec-head .meta{font-size:12px;color:var(--text-muted);margin-top:2px;}
.lider-item-row{border-top:1px solid #f5f6f8;padding:12px 0;}
.lider-item-row:first-child{border-top:none;padding-top:0;}
.lider-item-row.excluded{opacity:.45;}
.lider-item-row .txt{font-size:13.5px;font-weight:600;color:var(--text-dark);margin-bottom:8px;}
.excl-toggle{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-muted);cursor:pointer;margin-top:8px;user-select:none;}
.excl-toggle input{cursor:pointer;}

.report-textarea{
  width:100%;min-height:420px;font-family:'Menlo','Consolas',monospace;font-size:12.5px;
  line-height:1.6;border:1.5px solid var(--border);border-radius:10px;padding:16px;
  color:var(--text-dark);resize:vertical;background:#fafbfd;
}
.report-actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}

/* ENTREVISTADOS (auditor preenche ao fazer o checklist) */
.entrev-row{display:flex;gap:8px;align-items:center;padding:5px 0;}
.entrev-row input{flex:1;}
.entrev-list-view{font-size:12.5px;color:var(--text-dark);margin:6px 0 4px;}
.entrev-list-view .p{padding:3px 0;border-top:1px solid #f5f6f8;}
.entrev-list-view .p:first-child{border-top:none;}

/* CATEGORIA (classificação do líder: PP/OP/OBS/NC) */
.cat-select{
  font-family:'Inter',sans-serif;font-size:12px;font-weight:700;padding:6px 10px;
  border-radius:8px;border:1.5px solid var(--border);background:#fff;color:var(--text-dark);
  margin-top:8px;cursor:pointer;
}
.cat-select.cat-PP{border-color:var(--green-ok);color:var(--green-ok);}
.cat-select.cat-OP{border-color:var(--blue-400);color:#2a5a8c;}
.cat-select.cat-OBS{border-color:var(--amber-warn);color:var(--amber-warn);}
.cat-select.cat-NC{border-color:var(--red-600);color:var(--red-600);}

/* CABEÇALHO COMPLETO DA CAMPANHA (formulário RAI) */
.camp-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px;}
.camp-detail-grid .full{grid-column:1/-1;}
.camp-detail-grid label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);font-weight:600;display:block;margin-bottom:5px;}
.camp-detail-grid textarea{font-family:'Inter',sans-serif;font-size:13px;padding:8px 10px;border:1px solid var(--border);border-radius:6px;width:100%;min-height:60px;resize:vertical;}
@media (max-width:640px){ .camp-detail-grid{grid-template-columns:1fr;} }

</style>
</head>
<body>

<div class="app">

<script>
(function(){

// ⚠️ Cole aqui a URL do seu App da Web (Apps Script > Implantar > Nova implantação).
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwuAP1YpeYjMr_PSfsOG8UYCzll6sgMn7UqNzIPKEEwRr5Pw6dTyc6tb4AYIRPqBAWIgQ/exec';

// Precisa ser EXATAMENTE igual à constante SECRET no Code.gs.
const GESTOR_SECRET = 'auditoria2026';

const CATEGORIA_LABEL = { PP:'Ponto Positivo', OP:'Oportunidade de Melhoria', OBS:'Observação', NC:'Não Conformidade' };
const CATEGORIA_SIGLA = { PP:'PP', OP:'OP', OBS:'OBS', NC:'NC' };

let LIB = { checklists: [], itens: [], auditores: [] };
let CAMPANHAS = [];
let EXECUCOES = [];
let RESPOSTAS = [];
let loaded = false;
let storageAvailable = true;

let role = null; // 'gestor' | 'auditor' | 'lider'
let currentTab = 'painel';
let openDisciplinas = {};
let editingChecklistId = null;
let expandedAuditoriaId = null;
let editingCampId = null;

// fluxo do auditor comum
let auditorNome = '';
let auditorCampanhaId = '';
let auditorDisciplina = '';
let sorteio = null;
let respostasDraft = {};
let entrevistadosDraft = [];
let auditorSubmitted = null;

// fluxo do auditor líder
let liderCampanhaId = null;
let liderView = 'revisao';

// ---------- helpers ----------
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
const escapeAttr = escapeHtml;
function formatDate(iso){
  if(!iso) return '';
  try{
    const d = new Date(iso);
    if(isNaN(d.getTime())) return iso;
    return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  }catch(e){ return iso; }
}
function formatDateOnly(iso){
  if(!iso) return '';
  try{
    const d = new Date(iso);
    if(isNaN(d.getTime())) return iso;
    return d.toLocaleDateString('pt-BR');
  }catch(e){ return iso; }
}
function labelResultado(r){
  return r==='CONFORME'?'Conforme':r==='NAO_CONFORME'?'Não conforme':r==='NA'?'Não aplicável':'—';
}
function uid(){ return 'c_'+Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
function itensDoChecklist(checklistId){
  return LIB.itens.filter(i=>i.checklist_id===checklistId).sort((a,b)=>a.ordem-b.ordem);
}
function disciplinasExistentes(){
  return [...new Set(LIB.checklists.map(c=>c.disciplina).filter(Boolean))].sort();
}
function disciplinasAtivasParaAuditoria(){
  return [...new Set(LIB.checklists.filter(c=>c.ativo).map(c=>c.disciplina))].sort();
}
function execucaoMap(){
  const m = {};
  EXECUCOES.forEach(e=>{ m[e.id]=e; });
  return m;
}
function respostasPorExecucao(execId){
  return RESPOSTAS.filter(r=>r.execucao_id===execId).sort((a,b)=>a.ordem-b.ordem);
}
function execucoesDaCampanha(campId){
  return EXECUCOES.filter(e=>e.auditoria_id===campId);
}

// ---------- rede ----------
async function loadPublic(){
  try{
    const res = await fetch(APPS_SCRIPT_URL);
    if(!res.ok) throw new Error('status '+res.status);
    const data = await res.json();
    LIB = { checklists: data.checklists||[], itens: data.itens||[], auditores: data.auditores||[] };
    CAMPANHAS = data.campanhas||[];
    storageAvailable = true;
  }catch(e){
    LIB = { checklists:[], itens:[], auditores:[] };
    CAMPANHAS = [];
    storageAvailable = false;
  }
  loaded = true;
}
async function loadGestor(){
  try{
    const res = await fetch(APPS_SCRIPT_URL+'?secret='+encodeURIComponent(GESTOR_SECRET));
    if(!res.ok) throw new Error('status '+res.status);
    const data = await res.json();
    LIB = { checklists: data.checklists||[], itens: data.itens||[], auditores: data.auditores||[] };
    CAMPANHAS = data.campanhas||[];
    EXECUCOES = data.execucoes||[];
    RESPOSTAS = data.respostas||[];
    storageAvailable = true;
  }catch(e){
    storageAvailable = false;
  }
}
async function sortear(disciplina){
  try{
    const res = await fetch(APPS_SCRIPT_URL+'?action=sorteio&disciplina='+encodeURIComponent(disciplina));
    return await res.json();
  }catch(e){
    return { ok:false, error:'Não consegui falar com o servidor. Confira sua internet e tente de novo.' };
  }
}
async function postJson(payload){
  try{
    const res = await fetch(APPS_SCRIPT_URL, { method:'POST', body: JSON.stringify(payload) });
    return await res.json();
  }catch(e){
    return { ok:false, error:'Falha de conexão. Tente de novo.' };
  }
}

let saveTimer = null;
function scheduleSave(){
  clearTimeout(saveTimer);
  setSaveStatus('pending');
  saveTimer = setTimeout(()=>doSave(1), 500);
}
async function doSave(attempt){
  setSaveStatus('saving');
  const result = await postJson({ type:'cadastro', secret: GESTOR_SECRET, checklists: LIB.checklists, itens: LIB.itens, auditores: LIB.auditores });
  if(result && result.ok===false){ setSaveStatus('error'); alert('A planilha recusou o salvamento: '+(result.error||'erro desconhecido')); return; }
  if(result && result.ok===true){ setSaveStatus('saved'); storageAvailable = true; return; }
  if(attempt < 4){ setTimeout(()=>doSave(attempt+1), 700*attempt); }
  else { setSaveStatus('error'); storageAvailable = false; }
}

let saveCampTimer = null;
function scheduleSaveCampanhas(){
  clearTimeout(saveCampTimer);
  setSaveStatus('pending');
  saveCampTimer = setTimeout(()=>doSaveCampanhas(1), 500);
}
async function doSaveCampanhas(attempt){
  setSaveStatus('saving');
  const result = await postJson({ type:'campanhas', secret: GESTOR_SECRET, campanhas: CAMPANHAS });
  if(result && result.ok===false){ setSaveStatus('error'); alert('A planilha recusou o salvamento: '+(result.error||'erro desconhecido')); return; }
  if(result && result.ok===true){ setSaveStatus('saved'); storageAvailable = true; return; }
  if(attempt < 4){ setTimeout(()=>doSaveCampanhas(attempt+1), 700*attempt); }
  else { setSaveStatus('error'); storageAvailable = false; }
}
function setSaveStatus(s){
  const el = document.getElementById('saveStatus');
  if(!el) return;
  if(role!=='gestor' && role!=='lider'){ el.style.display='none'; return; }
  el.style.display = 'flex';
  const map = { pending:'● Alterações não salvas', saving:'Salvando…', saved:'✓ Salvo', error:'⚠ Falha ao salvar — tentando de novo' };
  el.textContent = map[s] || '';
  el.className = 'save-status '+s;
}

// ---------- ações: biblioteca ----------
function criarChecklist(disciplina, nome){
  const id = uid();
  LIB.checklists.push({ id, disciplina: disciplina.trim(), nome: nome.trim(), ativo: true });
  editingChecklistId = id;
  scheduleSave();
  render();
}
function toggleChecklistAtivo(id){ const c = LIB.checklists.find(c=>c.id===id); if(c){ c.ativo = !c.ativo; scheduleSave(); render(); } }
function excluirChecklist(id){
  const c = LIB.checklists.find(c=>c.id===id);
  if(!confirm('Excluir o checklist "'+(c?c.nome:'')+'" e todos os seus itens? Auditorias já realizadas com ele continuam no histórico.')) return;
  LIB.checklists = LIB.checklists.filter(c=>c.id!==id);
  LIB.itens = LIB.itens.filter(i=>i.checklist_id!==id);
  if(editingChecklistId===id) editingChecklistId = null;
  scheduleSave(); render();
}
function addItem(checklistId){
  const itens = itensDoChecklist(checklistId);
  LIB.itens.push({ checklist_id: checklistId, ordem: itens.length+1, item: '' });
  scheduleSave(); render();
}
function removeItem(checklistId, ordem){
  LIB.itens = LIB.itens.filter(i=>!(i.checklist_id===checklistId && i.ordem===ordem));
  itensDoChecklist(checklistId).forEach((it,idx)=>{ it.ordem = idx+1; });
  scheduleSave(); render();
}
function editItemText(checklistId, ordem, text){
  const it = LIB.itens.find(i=>i.checklist_id===checklistId && i.ordem===ordem);
  if(it){ it.item = text; scheduleSave(); }
}
function addAuditor(nome){
  nome = (nome||'').trim();
  if(!nome) return;
  if(LIB.auditores.some(a=>a.nome.toLowerCase()===nome.toLowerCase())){ alert('Esse auditor já está cadastrado.'); return; }
  LIB.auditores.push({ nome, ativo: true });
  scheduleSave(); render();
}
function toggleAuditorAtivo(nome){ const a = LIB.auditores.find(a=>a.nome===nome); if(a){ a.ativo = !a.ativo; scheduleSave(); render(); } }
function removerAuditor(nome){
  if(!confirm('Remover "'+nome+'" da lista de auditores?')) return;
  LIB.auditores = LIB.auditores.filter(a=>a.nome!==nome);
  scheduleSave(); render();
}

// ---------- ações: campanhas de auditoria (RAI) ----------
const CAMP_FIELDS_DEFAULT = { titulo:'', local:'', status:'aberta', lider:'', rai_numero:'', periodo_inicio:'', periodo_fim:'', objetivo:'', criterio:'', metodo:'', equipe:'', sede_obra:'', consideracoes_gerais:'' };
function criarCampanha(titulo){
  const camp = Object.assign({}, CAMP_FIELDS_DEFAULT, { id: uid(), titulo: titulo.trim(), data_criacao: new Date().toISOString() });
  CAMPANHAS.push(camp);
  editingCampId = camp.id;
  scheduleSaveCampanhas();
  render();
}
function editarCampanhaCampo(id, campo, valor){
  const c = CAMPANHAS.find(c=>c.id===id);
  if(c){ c[campo] = valor; scheduleSaveCampanhas(); }
}
function toggleCampanhaStatus(id){
  const c = CAMPANHAS.find(c=>c.id===id);
  if(c){ c.status = c.status==='aberta' ? 'encerrada' : 'aberta'; scheduleSaveCampanhas(); render(); }
}
async function excluirCampanha(id){
  const c = CAMPANHAS.find(c=>c.id===id);
  const qtd = execucoesDaCampanha(id).length;
  if(!confirm('Excluir a auditoria "'+(c?c.titulo:'')+'"? Isso vai apagar também os '+qtd+' checklist(s) preenchido(s) dentro dela. Essa ação não pode ser desfeita.')) return;
  const res = await postJson({ type:'excluir_auditoria', secret: GESTOR_SECRET, auditoria_id: id });
  if(!res.ok){ alert('Não consegui excluir: '+(res.error||'erro desconhecido')); return; }
  const idsRemovidos = new Set(EXECUCOES.filter(e=>e.auditoria_id===id).map(e=>e.id));
  CAMPANHAS = CAMPANHAS.filter(c=>c.id!==id);
  EXECUCOES = EXECUCOES.filter(e=>e.auditoria_id!==id);
  RESPOSTAS = RESPOSTAS.filter(r=>!idsRemovidos.has(r.execucao_id));
  if(liderCampanhaId===id) liderCampanhaId = null;
  render();
}
async function excluirExecucaoAction(execId){
  const e = EXECUCOES.find(e=>e.id===execId);
  if(!confirm('Excluir o checklist "'+(e?e.checklist_nome:'')+'" ('+(e?e.disciplina:'')+')? Essa ação não pode ser desfeita.')) return;
  const res = await postJson({ type:'excluir_execucao', secret: GESTOR_SECRET, execucao_id: execId });
  if(!res.ok){ alert('Não consegui excluir: '+(res.error||'erro desconhecido')); return; }
  EXECUCOES = EXECUCOES.filter(e=>e.id!==execId);
  RESPOSTAS = RESPOSTAS.filter(r=>r.execucao_id!==execId);
  render();
}
async function atualizarRespostaAction(execId, ordem, resultado, comentario, excluido, categoria){
  const r = RESPOSTAS.find(r=>r.execucao_id===execId && r.ordem===ordem);
  if(r){ r.resultado = resultado; r.comentario = comentario; r.excluido = excluido; r.categoria = categoria; }
  await postJson({ type:'atualizar_resposta', secret: GESTOR_SECRET, execucao_id: execId, ordem, resultado, comentario, excluido, categoria });
}

function updateStorageWarning(){
  const el = document.getElementById('storageWarning');
  const txt = document.getElementById('storageWarningText');
  if(!APPS_SCRIPT_URL){ el.style.display='flex'; txt.textContent = 'Defina a constante APPS_SCRIPT_URL no código do painel para começar a usar.'; }
  else if(!storageAvailable){ el.style.display='flex'; txt.textContent = 'Não consegui falar com a planilha agora. Verifique sua internet e a URL do Apps Script.'; }
  else { el.style.display='none'; }
}
function isAuthed(){
  try{ return sessionStorage.getItem('audc_gestor_secret') === GESTOR_SECRET; }
  catch(e){ return false; }
}
function render(){
  if(!loaded) return;
  updateStorageWarning();
  const pill = document.getElementById('modePill');
  if(role==='gestor'){ pill.textContent='Modo gestor'; pill.className='mode-pill edit'; }
  else if(role==='lider'){ pill.textContent='Modo auditor líder'; pill.className='mode-pill edit'; }
  else if(role==='auditor'){ pill.textContent='Modo auditor'; pill.className='mode-pill'; }
  else { pill.textContent='Selecione o acesso'; pill.className='mode-pill'; }

  document.getElementById('backToLandingWrap').style.display = role ? 'inline' : 'none';

  if(!role){ document.getElementById('controlsBar').style.display='none'; document.getElementById('content').innerHTML=''; return; }

  if(role==='gestor'){
    if(!isAuthed()) return;
    document.getElementById('controlsBar').style.display='flex';
    renderControlsGestor();
    renderGestorContent();
    setSaveStatus('saved');
    return;
  }
  if(role==='lider'){
    if(!isAuthed()) return;
    document.getElementById('controlsBar').style.display='none';
    renderLiderContent();
    return;
  }
  document.getElementById('controlsBar').style.display='none';
  renderAuditorContent();
}
function renderControlsGestor(){
  const bar = document.getElementById('controlsBar');
  const tabs = [['painel','Painel'],['checklists','Checklists'],['auditorias','Auditorias'],['auditores','Auditores'],['historico','Histórico']];
  bar.innerHTML = `<div class="tabbar">${tabs.map(([id,label])=>`<button class="tabbtn ${currentTab===id?'active':''}" data-tab="${id}">${label}</button>`).join('')}</div>`;
  bar.querySelectorAll('[data-tab]').forEach(btn=>{ btn.onclick = ()=>{ currentTab = btn.dataset.tab; render(); }; });
}
function renderGestorContent(){
  const content = document.getElementById('content');
  if(currentTab==='painel'){ content.innerHTML = renderPainelHtml(); return; }
  if(currentTab==='checklists'){ content.innerHTML = renderChecklistsHtml(); attachChecklistsTab(); return; }
  if(currentTab==='auditorias'){ content.innerHTML = renderAuditoriasCadastroHtml(); attachAuditoriasCadastroTab(); return; }
  if(currentTab==='auditores'){ content.innerHTML = renderAuditoresHtml(); attachAuditoresTab(); return; }
  content.innerHTML = renderHistoricoHtml(); attachHistoricoTab();
}

// ---------- render: painel ----------
function renderPainelHtml(){
  const totalExecucoes = EXECUCOES.length;
  const totalItens = RESPOSTAS.length;
  const conformes = RESPOSTAS.filter(r=>r.resultado==='CONFORME').length;
  const naoConformes = RESPOSTAS.filter(r=>r.resultado==='NAO_CONFORME').length;
  const base = conformes+naoConformes;
  const pctGeral = base ? Math.round((conformes/base)*1000)/10 : null;
  const pctClasse = pctGeral===null ? '' : (pctGeral>=90?'ok':(pctGeral>=70?'warn':'bad'));
  const campanhasAbertas = CAMPANHAS.filter(c=>c.status==='aberta').length;

  const kpis = `
    <div class="kpi-grid">
      <div class="kpi"><div class="label">Auditorias abertas</div><div class="value">${campanhasAbertas}</div><div class="note">${CAMPANHAS.length} no total</div></div>
      <div class="kpi"><div class="label">Checklists preenchidos</div><div class="value">${totalExecucoes}</div></div>
      <div class="kpi"><div class="label">Conformidade geral</div><div class="value ${pctClasse}">${pctGeral===null?'—':pctGeral+'%'}</div><div class="note">${conformes} conforme(s) de ${base} avaliado(s)</div></div>
      <div class="kpi"><div class="label">Não conformidades abertas</div><div class="value ${naoConformes>0?'bad':'ok'}">${naoConformes}</div></div>
    </div>`;

  const porDisc = {};
  RESPOSTAS.forEach(r=>{
    const e = execucaoMap()[r.execucao_id]; if(!e) return;
    const d = e.disciplina || '—';
    if(!porDisc[d]) porDisc[d] = { conf:0, naoConf:0 };
    if(r.resultado==='CONFORME') porDisc[d].conf++;
    else if(r.resultado==='NAO_CONFORME') porDisc[d].naoConf++;
  });
  const discList = Object.keys(porDisc).map(d=>{
    const b = porDisc[d].conf+porDisc[d].naoConf;
    return { d, pct: b?Math.round((porDisc[d].conf/b)*1000)/10:0, b };
  }).sort((x,y)=>y.pct-x.pct);
  const rankingHtml = discList.length ? discList.map(r=>`
    <div class="rank-row">
      <div class="rank-label">${escapeHtml(r.d)}</div>
      <div class="rank-track"><div class="rank-fill ${r.pct<70?'low':''}" style="width:${r.pct}%;"></div></div>
      <div class="rank-pct">${r.pct}%</div>
    </div>`).join('') : `<div class="empty">Ainda não há checklists concluídos.</div>`;

  const em = execucaoMap();
  const pend = RESPOSTAS.filter(r=>r.resultado==='NAO_CONFORME' && !r.excluido).map(r=>{
    const e = em[r.execucao_id]||{};
    return Object.assign({}, r, { auditor:e.auditor, disciplina:e.disciplina, checklist_nome:e.checklist_nome, data:e.data });
  }).sort((x,y)=> new Date(y.data||0) - new Date(x.data||0)).slice(0,15);
  const pendHtml = pend.length ? pend.map(p=>`
    <div class="pend-item">
      <div class="pend-dot"></div>
      <div class="pend-main">
        <div class="t">${escapeHtml(p.item)}</div>
        <div class="m">${escapeHtml(p.disciplina||'')} · ${escapeHtml(p.checklist_nome||'')} · ${escapeHtml(p.auditor||'')} · ${formatDate(p.data)}</div>
        ${p.comentario ? `<div class="e"><b>Evidência:</b> ${escapeHtml(p.comentario)}</div>` : ''}
      </div>
    </div>`).join('') : `<div class="empty"><b>Nenhuma não conformidade registrada.</b> Tudo certo por aqui.</div>`;

  return `
    <div class="section">${kpis}</div>
    <div class="section"><div class="section-title"><span class="bar"></span>Conformidade por disciplina</div><div class="card">${rankingHtml}</div></div>
    <div class="section"><div class="section-title"><span class="bar"></span>Não conformidades recentes</div><div class="card">${pendHtml}</div></div>
  `;
}

function attachChecklistsTab(){

  document.querySelectorAll('[data-edit]').forEach(el=>{ el.onclick = ()=>{ editingChecklistId = editingChecklistId===el.dataset.edit ? null : el.dataset.edit; render(); }; });
  document.querySelectorAll('[data-toggle]').forEach(el=>{ el.onclick = ()=> toggleChecklistAtivo(el.dataset.toggle); });
  document.querySelectorAll('[data-del]').forEach(el=>{ el.onclick = ()=> excluirChecklist(el.dataset.del); });
  document.querySelectorAll('[data-item-text]').forEach(el=>{ el.oninput = ()=>{ const [cid, ordem] = el.dataset.itemText.split('::'); editItemText(cid, Number(ordem), el.value); }; });

  document.querySelectorAll('[data-item-add]').forEach(el=>{ el.onclick = ()=> addItem(el.dataset.itemAdd); });
  document.querySelectorAll('[data-editor-close]').forEach(el=>{ el.onclick = ()=>{ editingChecklistId = null; render(); }; });
  const criarBtn = document.getElementById('criarChecklistBtn');
  if(criarBtn) criarBtn.onclick = ()=>{
    const disc = document.getElementById('novaDisciplina').value;

  };
}

// ---------- render: histórico ----------
function renderHistoricoHtml(){
  const campMap = {}; CAMPANHAS.forEach(c=>{ campMap[c.id]=c; });
  const sorted = [...EXECUCOES].sort((a,b)=> new Date(b.data||0) - new Date(a.data||0));
  const rows = sorted.length ? sorted.map(e=>{
    const resp = respostasPorExecucao(e.id);
    const conf = resp.filter(r=>r.resultado==='CONFORME').length;
    const nc = resp.filter(r=>r.resultado==='NAO_CONFORME').length;
    const base = conf+nc;
    const pct = base ? Math.round((conf/base)*1000)/10 : null;
    const isOpen = expandedAuditoriaId===e.id;
    const camp = campMap[e.auditoria_id];
    const detailRow = isOpen ? `
      <tr><td colspan="7" style="padding:0;">
        <div style="padding:14px 16px;background:#fafbfd;border-top:1px solid var(--border);">
          ${e.entrevistados && e.entrevistados.length ? `<div class="entrev-list-view"><b>Entrevistados:</b> ${e.entrevistados.map(p=>escapeHtml(p.nome)+' ('+escapeHtml(p.funcao)+')').join(', ')}</div>` : ''}
          ${resp.map(r=>`
            <div class="pend-item">
              <div class="pend-dot" style="background:${r.resultado==='CONFORME'?'var(--green-ok)':r.resultado==='NAO_CONFORME'?'var(--red-600)':'var(--amber-warn)'};"></div>
              <div class="pend-main">
                <div class="t">${escapeHtml(r.item)} <span style="font-weight:400;color:var(--text-muted);">— ${labelResultado(r.resultado)}${r.categoria?' · '+CATEGORIA_SIGLA[r.categoria]:''}${r.excluido?' · excluído do relatório':''}</span></div>
                ${r.comentario ? `<div class="m">${escapeHtml(r.comentario)}</div>` : ''}
              </div>
            </div>
          `).join('')}
        </div>
      </td></tr>` : '';
    return `
      <tr class="clickable" data-hist-toggle="${e.id}">
        <td>${formatDate(e.data)}</td>
        <td>${escapeHtml(e.auditor)}</td>
        <td><span class="disc-tag">${escapeHtml(e.disciplina)}</span></td>
        <td>${escapeHtml(e.checklist_nome)}</td>
        <td>${camp ? escapeHtml(camp.titulo) : '—'}</td>
        <td>${pct===null?'—':pct+'%'}</td>
        <td style="text-align:right;"><button class="icon-btn danger-btn" title="Excluir este checklist" data-hist-del="${e.id}">🗑</button></td>
      </tr>
      ${detailRow}
    `;
  }).join('') : `<tr><td colspan="7" class="empty-cad">Nenhum checklist registrado ainda.</td></tr>`;
  return `
    <div class="section">
      <div class="section-title"><span class="bar"></span>Histórico de checklists preenchidos</div>
      <div class="card">
        <table class="data-table"><thead><tr><th>Data</th><th>Auditor</th><th>Disciplina</th><th>Checklist</th><th>Auditoria</th><th>Conformidade</th><th></th></tr></thead><tbody>${rows}</tbody></table>
      </div>
    </div>
  `;
}
function attachHistoricoTab(){
  document.querySelectorAll('[data-hist-toggle]').forEach(el=>{ el.onclick = ()=>{ const id = el.dataset.histToggle; expandedAuditoriaId = expandedAuditoriaId===id ? null : id; render(); }; });
  document.querySelectorAll('[data-hist-del]').forEach(el=>{ el.onclick = (ev)=>{ ev.stopPropagation(); excluirExecucaoAction(el.dataset.histDel); }; });
}

// ---------- render: fluxo do auditor comum ----------
function renderAuditorContent(){
  const content = document.getElementById('content');
  if(auditorSubmitted){ content.innerHTML = renderSuccessHtml(); attachSuccess(); return; }
  if(!sorteio){ content.innerHTML = renderAuditorPickerHtml(); attachAuditorPicker(); return; }
  content.innerHTML = renderAuditorFormHtml(); attachAuditorForm();
}
function renderAuditorPickerHtml(){
  const nomes = LIB.auditores.filter(a=>a.ativo);
  const campsAbertas = CAMPANHAS.filter(c=>c.status==='aberta');
  const discs = disciplinasAtivasParaAuditoria();
  const faltando = [];
  if(!nomes.length) faltando.push('nenhum auditor');
  if(!campsAbertas.length) faltando.push('nenhuma auditoria aberta');
  if(!discs.length) faltando.push('nenhum checklist ativo');
  if(faltando.length){
    return `<div class="section"><div class="card"><div class="empty">O gestor ainda não cadastrou ${faltando.join(' nem ')}. Peça pra ele configurar a Central antes de iniciar uma auditoria.</div></div></div>`;
  }
  return `
    <div class="section">
      <div class="section-title"><span class="bar"></span>Iniciar auditoria</div>
      <div class="card">
        <div class="cad-form" style="border-top:none;padding-top:0;margin-top:0;">
          <div class="field" style="min-width:200px;"><label>Seu nome</label>
            <select id="auditorNomeSelect"><option value="">Selecione...</option>${nomes.map(a=>`<option value="${escapeAttr(a.nome)}">${escapeHtml(a.nome)}</option>`).join('')}</select>
          </div>
          <div class="field" style="min-width:220px;"><label>Qual auditoria você está fazendo</label>
            <select id="auditorCampSelect"><option value="">Selecione...</option>${campsAbertas.map(c=>`<option value="${escapeAttr(c.id)}">${escapeHtml(c.titulo)}${c.local?' — '+escapeHtml(c.local):''}</option>`).join('')}</select>
          </div>
          <div class="field" style="min-width:200px;"><label>Disciplina a auditar</label>
            <select id="auditorDiscSelect"><option value="">Selecione...</option>${discs.map(d=>`<option value="${escapeAttr(d)}">${escapeHtml(d)}</option>`).join('')}</select>
          </div>
          <button class="linkbtn" id="sortearBtn" style="background:var(--navy-800);color:#fff;border-color:var(--navy-800);">🎲 Sortear checklist</button>
        </div>
        <div id="sortearError" style="color:#c0392b;font-size:12.5px;margin-top:10px;"></div>
      </div>
    </div>
  `;
}
function attachAuditorPicker(){
  const btn = document.getElementById('sortearBtn');
  if(!btn) return;
  btn.onclick = async ()=>{
    const nome = document.getElementById('auditorNomeSelect').value;
    const campId = document.getElementById('auditorCampSelect').value;
    const disc = document.getElementById('auditorDiscSelect').value;
    const errEl = document.getElementById('sortearError');
    if(!nome || !campId || !disc){ errEl.textContent = 'Selecione seu nome, a auditoria e a disciplina.'; return; }
    errEl.textContent = '';
    btn.disabled = true; btn.textContent = 'Sorteando…';
    const res = await sortear(disc);
    btn.disabled = false; btn.textContent = '🎲 Sortear checklist';
    if(!res.ok){ errEl.textContent = res.error || 'Não consegui sortear um checklist.'; return; }
    auditorNome = nome; auditorCampanhaId = campId; auditorDisciplina = disc;
    sorteio = res.checklist; respostasDraft = {}; entrevistadosDraft = [];
    render();
  };
}
function renderEntrevistadosSection(){
  const rows = entrevistadosDraft.map((p,idx)=>`
    <div class="entrev-row">
      <input class="cad-input" data-entrev-field="${idx}::nome" value="${escapeAttr(p.nome)}" placeholder="Nome">
      <input class="cad-input" data-entrev-field="${idx}::funcao" value="${escapeAttr(p.funcao)}" placeholder="Função">
      <button class="icon-btn danger-btn" data-entrev-del="${idx}" title="Remover">✕</button>
    </div>

  return `
    <div class="card" style="margin-bottom:16px;">
      <div class="section-title" style="font-size:15px;margin-bottom:8px;"><span class="bar"></span>Pessoas entrevistadas (amostragem)</div>
      ${rows || '<div class="empty-cad">Nenhuma pessoa adicionada ainda — opcional, mas ajuda no relatório final.</div>'}
      <button class="linkbtn" id="entrevAddBtn" style="margin-top:8px;">+ Adicionar pessoa</button>
    </div>

}
function attachEntrevistadosSection(){
  document.querySelectorAll('[data-entrev-field]').forEach(el=>{
    el.oninput = ()=>{ const [idx, campo] = el.dataset.entrevField.split('::'); entrevistadosDraft[Number(idx)][campo] = el.value; };

  });
  const addBtn = document.getElementById('entrevAddBtn');
  if(addBtn) addBtn.onclick = ()=>{ entrevistadosDraft.push({ nome:'', funcao:'' }); render(); };
}
function renderAuditorFormHtml(){
  const itens = sorteio.itens;
  const camp = CAMPANHAS.find(c=>c.id===auditorCampanhaId);
  const respondidos = itens.filter(it=>respostasDraft[it.ordem] && respostasDraft[it.ordem].resultado).length;
  const itemsHtml = itens.map(it=>{
    const draft = respostasDraft[it.ordem] || { resultado:null, comentario:'' };
    const invalid = draft.resultado==='NAO_CONFORME' && !(draft.comentario||'').trim();
    return `
      <div class="item-card ${invalid?'invalid':''}" data-item-card="${it.ordem}">
        <div class="item-num">Item ${it.ordem} de ${itens.length}</div>
        <div class="item-txt">${escapeHtml(it.item)}</div>
        <div class="result-group">
          <button class="result-btn conforme ${draft.resultado==='CONFORME'?'on':''}" data-res="${it.ordem}::CONFORME">✓ Conforme</button>
          <button class="result-btn naoconforme ${draft.resultado==='NAO_CONFORME'?'on':''}" data-res="${it.ordem}::NAO_CONFORME">✕ Não conforme</button>
          <button class="result-btn na ${draft.resultado==='NA'?'on':''}" data-res="${it.ordem}::NA">— Não aplicável</button>
        </div>
        <textarea class="item-comment ${invalid?'required':''}" data-comment="${it.ordem}" placeholder="Evidência objetiva / observações...">${escapeHtml(draft.comentario)}</textarea>
        <div class="comment-hint ${invalid?'required':''}">${invalid ? 'Obrigatório detalhar a evidência quando o item não está conforme.' : 'Opcional para itens conformes ou N/A.'}</div>
      </div>
    `;
  }).join('');
  return `
    <div class="section">
      <div class="section-title"><span class="bar"></span>${escapeHtml(sorteio.nome)}</div>
      <div class="auditor-progress">
        <span class="disc-tag">${escapeHtml(sorteio.disciplina)}</span> &nbsp;
        Auditoria: <b>${camp?escapeHtml(camp.titulo):'—'}</b> &nbsp;·&nbsp;
        Auditor: <b>${escapeHtml(auditorNome)}</b> &nbsp;·&nbsp;
        <b>${respondidos}</b> de ${itens.length} itens respondidos
      </div>
      ${renderEntrevistadosSection()}
      ${itemsHtml}
      <div class="card" style="display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;">
        <button class="tabbtn" id="cancelarSorteioBtn">← Recomeçar</button>
        <button class="linkbtn" id="enviarAuditoriaBtn" style="background:var(--navy-800);color:#fff;border-color:var(--navy-800);padding:12px 22px;">Enviar auditoria</button>
      </div>
      <div id="enviarError" style="color:#c0392b;font-size:12.5px;margin-top:10px;text-align:right;"></div>
    </div>
  `;
}
function attachAuditorForm(){
  attachEntrevistadosSection();
  document.querySelectorAll('[data-res]').forEach(btn=>{
    btn.onclick = ()=>{
      const [ordem, resultado] = btn.dataset.res.split('::');
      const o = Number(ordem);
      if(!respostasDraft[o]) respostasDraft[o] = { resultado:null, comentario:'' };
      respostasDraft[o].resultado = resultado;
      render();
    };
  });
  document.querySelectorAll('[data-comment]').forEach(ta=>{
    ta.oninput = ()=>{
      const o = Number(ta.dataset.comment);
      if(!respostasDraft[o]) respostasDraft[o] = { resultado:null, comentario:'' };
      respostasDraft[o].comentario = ta.value;
    };
  });
  const cancelBtn = document.getElementById('cancelarSorteioBtn');
  if(cancelBtn) cancelBtn.onclick = ()=>{
    if(!confirm('Cancelar essa auditoria? Você poderá sortear outro checklist depois.')) return;
    sorteio = null; respostasDraft = {}; entrevistadosDraft = []; render();
  };
  const enviarBtn = document.getElementById('enviarAuditoriaBtn');
  if(enviarBtn) enviarBtn.onclick = async ()=>{
    const itens = sorteio.itens;
    const faltando = itens.filter(it=> !respostasDraft[it.ordem] || !respostasDraft[it.ordem].resultado);
    const semEvidencia = itens.filter(it=> respostasDraft[it.ordem] && respostasDraft[it.ordem].resultado==='NAO_CONFORME' && !(respostasDraft[it.ordem].comentario||'').trim());
    const errEl = document.getElementById('enviarError');
    if(faltando.length){ errEl.textContent = `Faltam ${faltando.length} item(ns) sem resposta.`; render(); return; }
    if(semEvidencia.length){ errEl.textContent = `Descreva a evidência objetiva nos itens não conformes (${semEvidencia.length}).`; render(); return; }
    errEl.textContent = '';
    enviarBtn.disabled = true; enviarBtn.textContent = 'Enviando…';
    const respostas = itens.map(it=>({
      ordem: it.ordem, item: it.item,
      resultado: respostasDraft[it.ordem].resultado,
      comentario: (respostasDraft[it.ordem].comentario||'').trim()
    }));
    const entrevistados = entrevistadosDraft.filter(p=>p.nome.trim()).map(p=>({ nome:p.nome.trim(), funcao:(p.funcao||'').trim() }));
    const payload = {
      type: 'auditoria',
      auditoria: { checklist_id: sorteio.id, disciplina: sorteio.disciplina, checklist_nome: sorteio.nome, auditor: auditorNome, data: new Date().toISOString(), auditoria_id: auditorCampanhaId },
      respostas, entrevistados
    };
    const res = await postJson(payload);
    if(!res.ok){ enviarBtn.disabled = false; enviarBtn.textContent = 'Enviar auditoria'; errEl.textContent = res.error || 'Falha ao enviar. Tente de novo.'; return; }
    auditorSubmitted = {
      conformes: respostas.filter(r=>r.resultado==='CONFORME').length,
      naoConformes: respostas.filter(r=>r.resultado==='NAO_CONFORME').length,
      nas: respostas.filter(r=>r.resultado==='NA').length,
      checklistNome: sorteio.nome, disciplina: sorteio.disciplina
    };
    render();
  };
}
function renderSuccessHtml(){
  const s = auditorSubmitted;
  return `
    <div class="section"><div class="card success-box">
      <div class="ico">✅</div>
      <h2 style="color:var(--navy-900);">Auditoria enviada!</h2>
      <div style="color:var(--text-muted);font-size:13.5px;margin-bottom:6px;">${escapeHtml(s.checklistNome)} · ${escapeHtml(s.disciplina)}</div>
      <div class="result-summary-strip" style="justify-content:center;">
        <span class="chip ok">${s.conformes} conforme(s)</span>

        <span class="chip na">${s.nas} N/A</span>
      </div>
      <button class="linkbtn" id="novaAuditoriaBtn" style="background:var(--navy-800);color:#fff;border-color:var(--navy-800);margin-top:22px;">Nova auditoria</button>
    </div></div>
  `;
}
function attachSuccess(){
  document.getElementById('novaAuditoriaBtn').onclick = ()=>{
    auditorSubmitted = null; sorteio = null; respostasDraft = {}; entrevistadosDraft = []; auditorNome=''; auditorCampanhaId=''; auditorDisciplina='';
    render();
  };
}

function renderLiderContent(){
  const content = document.getElementById('content');
  if(!liderCampanhaId){ content.innerHTML = renderLiderPickerHtml(); attachLiderPicker(); return; }
  if(liderView==='relatorio'){ content.innerHTML = renderRelatorioHtml(liderCampanhaId); attachRelatorio(); return; }
  content.innerHTML = renderLiderRevisaoHtml(liderCampanhaId); attachLiderRevisao();
}
function renderLiderPickerHtml(){
  const sorted = [...CAMPANHAS].sort((a,b)=> new Date(b.data_criacao||0) - new Date(a.data_criacao||0));
  if(!sorted.length){ return `<div class="section"><div class="card"><div class="empty">Nenhuma auditoria foi criada ainda. Peça pro gestor abrir uma na aba "Auditorias".</div></div></div>`; }

    const qtd = execucoesDaCampanha(c.id).length;
    return `
      <div class="camp-card" data-camp-pick="${c.id}">
        <div class="info"><div class="titulo">${escapeHtml(c.titulo)}</div><div class="meta">${c.rai_numero?escapeHtml(c.rai_numero)+' · ':''}${c.local?escapeHtml(c.local)+' · ':''}${formatDateOnly(c.data_criacao)}</div></div>
        <div class="cnt">${qtd} checklist(s)</div>
        <span class="status-tag ${c.status==='aberta'?'ativo':'inativo'}">${c.status==='aberta'?'Aberta':'Encerrada'}</span>
      </div>
    `;

  return `<div class="section"><div class="section-title"><span class="bar"></span>Escolha a auditoria pra revisar</div>${cards}</div>`;

function attachLiderPicker(){
  document.querySelectorAll('[data-camp-pick]').forEach(el=>{ el.onclick = ()=>{ liderCampanhaId = el.dataset.campPick; liderView = 'revisao'; render(); }; });
}
function catButtonsHtml(execId, ordem, atual){
  const opts = ['', 'PP','OP','OBS','NC'];
  return `<select class="cat-select ${atual?'cat-'+atual:''}" data-lider-cat="${execId}::${ordem}">
    ${opts.map(o=>`<option value="${o}" ${atual===o?'selected':''}>${o===''?'Sem categoria no relatório':CATEGORIA_SIGLA[o]+' — '+CATEGORIA_LABEL[o]}</option>`).join('')}
  </select>`;
}
function renderLiderRevisaoHtml(campId){
  const camp = CAMPANHAS.find(c=>c.id===campId);
  const execs = execucoesDaCampanha(campId).sort((a,b)=> new Date(a.data||0)-new Date(b.data||0));
  const execsHtml = execs.length ? execs.map(e=>{
    const resp = respostasPorExecucao(e.id);
    const entrevHtml = e.entrevistados && e.entrevistados.length
      ? `<div class="entrev-list-view">${e.entrevistados.map(p=>`<div class="p"><b>${escapeHtml(p.nome)}</b> — ${escapeHtml(p.funcao||'—')}</div>`).join('')}</div>` : '';
    const itemsHtml = resp.map(r=>{
      const excl = !!r.excluido;
      return `
        <div class="lider-item-row ${excl?'excluded':''}" data-lider-row="${e.id}::${r.ordem}">
          <div class="txt">${r.ordem}. ${escapeHtml(r.item)}</div>
          <div class="result-group">
            <button class="result-btn conforme ${r.resultado==='CONFORME'?'on':''}" data-lider-res="${e.id}::${r.ordem}::CONFORME">✓ Conforme</button>
            <button class="result-btn naoconforme ${r.resultado==='NAO_CONFORME'?'on':''}" data-lider-res="${e.id}::${r.ordem}::NAO_CONFORME">✕ Não conforme</button>
            <button class="result-btn na ${r.resultado==='NA'?'on':''}" data-lider-res="${e.id}::${r.ordem}::NA">— N/A</button>
          </div>
          <textarea class="item-comment" data-lider-comment="${e.id}::${r.ordem}" placeholder="Evidência / observações...">${escapeHtml(r.comentario)}</textarea>
          ${catButtonsHtml(e.id, r.ordem, r.categoria)}
          <label class="excl-toggle"><input type="checkbox" data-lider-excl="${e.id}::${r.ordem}" ${excl?'checked':''}> Excluir este ponto do relatório final</label>

    return `

        <div class="lider-exec-head">
          <div><div class="titulo">${escapeHtml(e.disciplina)} — ${escapeHtml(e.checklist_nome)}</div><div class="meta">Auditor: ${escapeHtml(e.auditor)} · ${formatDate(e.data)}</div></div>

  return `
    <div class="section">
      <div class="section-title"><span class="bar"></span>${escapeHtml(camp.titulo)} ${camp.rai_numero?'<span style="font-size:14px;color:var(--text-muted);font-weight:400;">— '+escapeHtml(camp.rai_numero)+'</span>':''}</div>
      <div class="card" style="margin-bottom:16px;">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
          <div class="auditor-progress" style="margin:0;">${camp.sede_obra?escapeHtml(camp.sede_obra)+' · ':''}${formatDateOnly(camp.data_criacao)} · <span class="status-tag ${camp.status==='aberta'?'ativo':'inativo'}">${camp.status==='aberta'?'Aberta':'Encerrada'}</span></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="tabbtn" id="liderVoltarBtn">← Trocar de auditoria</button>
            <button class="tabbtn" id="liderEncerrarBtn">${camp.status==='aberta'?'Encerrar auditoria':'Reabrir auditoria'}</button>
            <button class="icon-btn danger-btn" title="Excluir auditoria inteira" id="liderExcluirCampBtn">🗑</button>
            <button class="linkbtn" id="liderRelatorioBtn" style="background:var(--navy-800);color:#fff;border-color:var(--navy-800);">📄 Gerar relatório</button>
          </div>
        </div>
        <div class="field" style="margin-top:14px;">
          <label>Considerações gerais (texto livre pro relatório)</label>
          <textarea id="liderConsidGerais" style="width:100%;min-height:80px;font-family:'Inter',sans-serif;font-size:13px;padding:8px 10px;border:1px solid var(--border);border-radius:6px;" placeholder="Parágrafo geral sobre a auditoria...">${escapeHtml(camp.consideracoes_gerais)}</textarea>
        </div>
      </div>
      ${execsHtml}
    </div>
  `;
}
function attachLiderRevisao(){
  document.getElementById('liderVoltarBtn').onclick = ()=>{ liderCampanhaId = null; render(); };
  document.getElementById('liderRelatorioBtn').onclick = ()=>{ liderView = 'relatorio'; render(); };
  document.getElementById('liderEncerrarBtn').onclick = ()=>{ toggleCampanhaStatus(liderCampanhaId); };
  document.getElementById('liderExcluirCampBtn').onclick = ()=> excluirCampanha(liderCampanhaId);
  let cgTimer = null;
  document.getElementById('liderConsidGerais').oninput = (ev)=>{
    clearTimeout(cgTimer);
    cgTimer = setTimeout(()=>{ editarCampanhaCampo(liderCampanhaId, 'consideracoes_gerais', ev.target.value); }, 500);
  };
  document.querySelectorAll('[data-lider-del-exec]').forEach(el=>{ el.onclick = ()=> excluirExecucaoAction(el.dataset.liderDelExec); });
  document.querySelectorAll('[data-lider-res]').forEach(btn=>{
    btn.onclick = ()=>{
      const [execId, ordem, resultado] = btn.dataset.liderRes.split('::');
      const o = Number(ordem);
      const r = RESPOSTAS.find(r=>r.execucao_id===execId && r.ordem===o);
      const comentario = r ? r.comentario : '';
      const excluido = r ? r.excluido : false;
      let categoria = r ? r.categoria : '';
      if(resultado==='NAO_CONFORME' && !categoria) categoria = 'NC';
      atualizarRespostaAction(execId, o, resultado, comentario, excluido, categoria);
      render();
    };
  });
  document.querySelectorAll('[data-lider-comment]').forEach(ta=>{
    let t = null;
    ta.oninput = ()=>{
      clearTimeout(t);
      t = setTimeout(()=>{
        const [execId, ordem] = ta.dataset.liderComment.split('::');
        const o = Number(ordem);
        const r = RESPOSTAS.find(r=>r.execucao_id===execId && r.ordem===o);
        atualizarRespostaAction(execId, o, r?r.resultado:null, ta.value, r?r.excluido:false, r?r.categoria:'');
      }, 600);
    };
  });
  document.querySelectorAll('[data-lider-excl]').forEach(chk=>{
    chk.onchange = ()=>{
      const [execId, ordem] = chk.dataset.liderExcl.split('::');
      const o = Number(ordem);
      const r = RESPOSTAS.find(r=>r.execucao_id===execId && r.ordem===o);
      atualizarRespostaAction(execId, o, r?r.resultado:null, r?r.comentario:'', chk.checked, r?r.categoria:'');
      render();
    };
  });
  document.querySelectorAll('[data-lider-cat]').forEach(sel=>{
    sel.onchange = ()=>{
      const [execId, ordem] = sel.dataset.liderCat.split('::');
      const o = Number(ordem);
      const r = RESPOSTAS.find(r=>r.execucao_id===execId && r.ordem===o);
      atualizarRespostaAction(execId, o, r?r.resultado:null, r?r.comentario:'', r?r.excluido:false, sel.value);
      render();
    };
  });
}

// ---------- relatório em texto (modelo RAI Milplan) ----------
function buildRelatorioTexto(campId){
  const camp = CAMPANHAS.find(c=>c.id===campId);
  const execs = execucoesDaCampanha(campId).sort((a,b)=> new Date(a.data||0)-new Date(b.data||0));
  let L = [];

  L.push('RELATÓRIO DE AUDITORIA INTERNA DO SIG');
  L.push(camp.rai_numero ? 'RAI n°: '+camp.rai_numero : '');
  L.push(camp.titulo || '');
  if(camp.sede_obra) L.push('Sede/Obra: '+camp.sede_obra);
  if(camp.periodo_inicio || camp.periodo_fim) L.push('Período da Auditoria: '+formatDateOnly(camp.periodo_inicio)+' e '+formatDateOnly(camp.periodo_fim));
  if(camp.objetivo) L.push('Objetivo da Auditoria: '+camp.objetivo);
  if(camp.lider) L.push('Auditor Líder: '+camp.lider);
  if(camp.equipe) L.push('Membros da Equipe Auditora: '+camp.equipe);
  if(camp.criterio) L.push('Critério da Auditoria: '+camp.criterio);
  if(camp.metodo) L.push('Método da Auditoria: '+camp.metodo);
  L = L.filter(l=>l!=='');
  L.push('');

  if(camp.consideracoes_gerais){
    L.push('CONSIDERAÇÕES GERAIS');
    L.push(camp.consideracoes_gerais);
    L.push('');
  }

  L.push('CONSIDERAÇÕES ESPECÍFICAS');
  L.push('');
  const porDisc = {};
  execs.forEach(e=>{ (porDisc[e.disciplina] = porDisc[e.disciplina]||[]).push(e); });
  Object.keys(porDisc).forEach(disc=>{
    L.push('PROCESSO AUDITADO: '+disc.toUpperCase());
    const execsDisc = porDisc[disc];
    const entrevistados = [];
    execsDisc.forEach(e=>{ (e.entrevistados||[]).forEach(p=>entrevistados.push(p)); });
    if(entrevistados.length){
      L.push('Pessoas entrevistadas:');
      entrevistados.forEach(p=>{ L.push('- '+p.nome+(p.funcao?' ('+p.funcao+')':'')); });
    }
    L.push('Constatações:');
    execsDisc.forEach(e=>{
      respostasPorExecucao(e.id).filter(r=>!r.excluido).forEach(r=>{
        if(r.comentario){
          L.push('- '+r.comentario+' ['+labelResultado(r.resultado)+(r.categoria?' · '+CATEGORIA_SIGLA[r.categoria]:'')+']');
        }
      });
    });
    L.push('');
  });

  const achados = { PP:[], OP:[], OBS:[], NC:[] };
  execs.forEach(e=>{
    respostasPorExecucao(e.id).filter(r=>!r.excluido && r.categoria && achados[r.categoria]).forEach(r=>{
      achados[r.categoria].push({ disciplina: e.disciplina, item: r.item, comentario: r.comentario });
    });
  });

  L.push('CONSIDERAÇÕES FINAIS');
  L.push('');
  if(achados.PP.length){
    L.push('Pontos Positivos:');
    achados.PP.forEach(a=>{ L.push('• '+(a.comentario||a.item)+' ['+a.disciplina+']'); });
    L.push('');
  }
  if(achados.OP.length){
    L.push('Oportunidades de Melhoria:');
    achados.OP.forEach((a,i)=>{ L.push('OP-'+String(i+1).padStart(2,'0')+': '+(a.comentario||a.item)+' ['+a.disciplina+']'); });
    L.push('');
  }
  if(achados.OBS.length){
    L.push('Observações:');
    achados.OBS.forEach((a,i)=>{ L.push('OBS-'+String(i+1).padStart(2,'0')+': '+(a.comentario||a.item)+' ['+a.disciplina+']'); });
    L.push('');
  }
  if(achados.NC.length){
    L.push('Não conformidades:');
    achados.NC.forEach((a,i)=>{ L.push('NC-'+String(i+1).padStart(2,'0')+': '+(a.comentario||a.item)+' ['+a.disciplina+']'); });
    L.push('');
  }

  L.push('APROVAÇÃO');
  if(camp.lider) L.push('Auditor Líder: '+camp.lider+' — Aprovação Eletrônica');
  if(camp.equipe) L.push('Membros: '+camp.equipe+' — Aprovação Eletrônica');
  L.push('Data da Emissão: '+formatDateOnly(new Date().toISOString()));

  return L.join('\n');
}
function renderRelatorioHtml(campId){
  const texto = buildRelatorioTexto(campId);
  return `
    <div class="section">
      <div class="section-title"><span class="bar"></span>Relatório da auditoria</div>
      <div class="card">
        <textarea class="report-textarea" id="relatorioTexto" readonly>${escapeHtml(texto)}</textarea>
        <div class="report-actions">
          <button class="tabbtn" id="relatorioVoltarBtn">← Voltar pra revisão</button>
          <button class="linkbtn" id="relatorioCopiarBtn">📋 Copiar texto</button>
          <button class="linkbtn" id="relatorioWordBtn" style="background:var(--navy-800);color:#fff;border-color:var(--navy-800);">⬇ Baixar como Word (.doc)</button>
        </div>
      </div>
    </div>
  `;
}
function attachRelatorio(){
  document.getElementById('relatorioVoltarBtn').onclick = ()=>{ liderView = 'revisao'; render(); };
  document.getElementById('relatorioCopiarBtn').onclick = ()=>{
    const ta = document.getElementById('relatorioTexto');
    ta.select();
    navigator.clipboard && navigator.clipboard.writeText(ta.value).then(()=>alert('Texto copiado!')).catch(()=>document.execCommand('copy'));
  };
  document.getElementById('relatorioWordBtn').onclick = ()=>{
    const texto = buildRelatorioTexto(liderCampanhaId);
    const htmlBody = texto.split('\n').map(l=>{
      if(l==='') return '<p>&nbsp;</p>';
      const isHeading = l===l.toUpperCase() && l.replace(/[^A-ZÀ-Ú]/g,'').length>3 && !l.includes(':');
      return isHeading ? `<p style="margin:14px 0 6px;font-weight:bold;">${escapeHtml(l)}</p>` : `<p style="margin:0 0 4px;">${escapeHtml(l)}</p>`;
    }).join('');
    const htmlDoc = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
      <head><meta charset='utf-8'><title>Relatório de Auditoria</title></head>
      <body style="font-family:Calibri, Arial, sans-serif;font-size:11pt;">${htmlBody}</body></html>`;
    const blob = new Blob(['\ufeff', htmlDoc], { type: 'application/msword' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'relatorio-auditoria.doc';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };
}

// ---------- landing / auth ----------
function showLanding(){
  document.getElementById('authOverlay').style.display = 'none';
  document.getElementById('landingOverlay').style.display = 'flex';
  document.getElementById('landingGestorBtn').onclick = async ()=>{
    document.getElementById('landingOverlay').style.display = 'none';
    if(isAuthed()){ role='gestor'; try{sessionStorage.setItem('audc_role','gestor');}catch(e){} await loadGestor(); render(); }
    else showAuthGate('gestor');
  };
  document.getElementById('landingLiderBtn').onclick = async ()=>{
    document.getElementById('landingOverlay').style.display = 'none';
    if(isAuthed()){ role='lider'; try{sessionStorage.setItem('audc_role','lider');}catch(e){} await loadGestor(); render(); }
    else showAuthGate('lider');
  };
  document.getElementById('landingAuditorBtn').onclick = ()=>{
    document.getElementById('landingOverlay').style.display = 'none';
    role = 'auditor';
    render();
  };
}
function showAuthGate(targetRole, errorMsg){
  document.getElementById('landingOverlay').style.display = 'none';
  const overlay = document.getElementById('authOverlay');
  const input = document.getElementById('authInput');
  const errEl = document.getElementById('authError');
  overlay.style.display = 'flex';
  errEl.textContent = errorMsg || '';
  input.value = '';
  setTimeout(()=>input.focus(), 50);
  async function trySubmit(){
    if(input.value === GESTOR_SECRET){
      try{ sessionStorage.setItem('audc_gestor_secret', input.value); sessionStorage.setItem('audc_role', targetRole); }catch(e){}
      overlay.style.display = 'none';
      role = targetRole;
      await loadGestor();
      render();
    } else {
      errEl.textContent = 'Senha incorreta. Tente de novo.';
      input.value = '';
      input.focus();
    }
  }
  document.getElementById('authSubmitBtn').onclick = trySubmit;
  input.onkeydown = (e)=>{ if(e.key==='Enter') trySubmit(); };
  document.getElementById('authBackBtn').onclick = ()=>{ overlay.style.display = 'none'; showLanding(); };
}

(async function init(){
  document.getElementById('backToLandingBtn').onclick = (e)=>{
    e.preventDefault();
    role = null; sorteio = null; auditorSubmitted = null; respostasDraft = {}; entrevistadosDraft = [];
    currentTab = 'painel'; liderCampanhaId = null; liderView = 'revisao'; editingCampId = null;
    try{ sessionStorage.removeItem('audc_role'); }catch(err){}
    render();
    showLanding();
  };
  await loadPublic();
  const savedRole = (function(){ try{ return sessionStorage.getItem('audc_role'); }catch(e){ return null; } })();
  if(isAuthed() && (savedRole==='gestor' || savedRole==='lider')){
    role = savedRole;
    await loadGestor();
    render();
    return;
  }
  render();
  showLanding();
})();

})();
